<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>결혼식 일정 등록하기</title>
<meta name="description" content="버튼을 누르면 휴대폰 기본 캘린더에 12월 12일(토) 오후 5시 일정이 등록돼요">
<meta property="og:type" content="website">
<meta property="og:title" content="📅 결혼식 일정 등록하기">
<meta property="og:description" content="누르면 기본 캘린더에 12월 12일(토) 오후 5시 일정이 등록돼요">
<meta property="og:url" content="https://haewon2115.github.io/calendar.html">
<meta property="og:image" content="https://haewon2115.github.io/thumb-photo.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:only light;background:#DDEEFB}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#DDEEFB;color:#1E3F8A;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center;line-height:1.7}
.card{width:100%;max-width:22rem;background:#EEF6FD;border:1px solid #B4D1EA;border-radius:1.2rem;padding:2rem 1.4rem;box-shadow:0 .6rem 1.6rem rgba(30,63,138,.1)}
h1{margin:.2rem 0 .3rem;font-size:1.25rem;font-weight:600}
.when{margin:0;font-size:1.05rem}
.where{margin:.1rem 0 1.4rem;font-size:.92rem;color:#4C6EA8}
.btn{display:block;width:100%;padding:.95rem 1rem;border:0;border-radius:3rem;background:#1E3F8A;color:#fff;font-size:1.05rem;font-family:inherit;text-decoration:none;cursor:pointer}
.sub{display:block;margin-top:.9rem;font-size:.82rem;color:#4C6EA8}
.note{margin:1rem 0 0;font-size:.82rem;color:#4C6EA8}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <p style="margin:0;font-size:2rem">📅</p>
  <h1>정순원 · 박해경 결혼식</h1>
  <p class="when">2026년 12월 12일 토요일 오후 5시</p>
  <p class="where">힐스카이웨딩&amp;컨벤션 10층 힐그랜드홀</p>

  <a class="btn" id="add" href="wedding.ics">캘린더에 일정 등록하기</a>
  <a class="btn" id="ext" href="#" hidden>기본 브라우저로 열기</a>
  <a class="sub" id="google" href="#" target="_blank" rel="noopener">구글 캘린더로 등록하기</a>
  <p class="note" id="note" hidden></p>
</main>
<script>
(function(){
  var UA = navigator.userAgent || "";
  var IS_ANDROID = /Android/i.test(UA);
  var IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/i.test(UA) && navigator.maxTouchPoints > 1);
  var IS_SAMSUNG = /SAMSUNG|SM-[A-Z0-9]|SCG\d|Galaxy/i.test(UA);
  var IN_KAKAO = /KAKAOTALK/i.test(UA);

  var start = "20261212T080000Z", end = "20261212T093000Z";   /* 17:00-18:30 KST */
  var title = "정순원 · 박해경 결혼식";
  var desc  = "정순원 · 박해경의 결혼식입니다.";
  var loc   = "힐스카이웨딩&컨벤션 10층 힐그랜드홀, 경남 창원시 마산회원구 봉양로 133";
  var gUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(title) + "&dates=" + start + "/" + end
    + "&details=" + encodeURIComponent(desc) + "&location=" + encodeURIComponent(loc);

  var add = document.getElementById("add");
  var ext = document.getElementById("ext");
  var note = document.getElementById("note");
  document.getElementById("google").href = gUrl;

  if(IN_KAKAO){
    /* KakaoTalk's in-app browser cannot hand events to the calendar: open the phone's normal browser first */
    add.hidden = true; ext.hidden = false;
    ext.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    note.hidden = false;
    note.textContent = "카카오톡 안에서는 캘린더에 바로 등록되지 않아요. 위 버튼으로 기본 브라우저를 열어 주세요.";
  }else if(IS_ANDROID){
    /* Android: Samsung Calendar on Galaxy phones, otherwise the default calendar; Google Calendar link as fallback */
    add.href = "intent://#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/event"
      + (IS_SAMSUNG ? ";package=com.samsung.android.calendar" : "")
      + ";S.title=" + encodeURIComponent(title)
      + ";S.description=" + encodeURIComponent(desc)
      + ";S.eventLocation=" + encodeURIComponent(loc)
      + ";l.beginTime=1797062400000;l.endTime=1797067800000"
      + ";S.browser_fallback_url=" + encodeURIComponent(gUrl) + ";end";
  }else if(IS_IOS){
    add.href = "wedding.ics";   /* Safari opens the built-in calendar's "add event" screen */
  }
})();
</script>
</body>
</html>
